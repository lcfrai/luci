# pipelines/secrets.yml — the secret scanner (phase 8 task 28): gitleaks over a pull request's own
# commits (<merge base with the target>..HEAD), and over the full history on a push to main or
# dev. .gitleaks.toml allowlists the known test fixtures by path and exact value, never by a broad
# regex. Findings are printed redacted.
#
# pr: is the record of the pull-request path filter: Azure Repos reads the branch policy's filter,
# not this block (UNVERIFIED, see azure-pipelines.yml); task 31's runbook copies it there. "/" is
# the repository root: every change.
trigger:
  branches:
    include: [main, dev]
  paths:
    include: ['/']
pr:
  branches:
    include: ['*']
  paths:
    include: ['/']

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: pull_request
    condition: eq(variables['Build.Reason'], 'PullRequest')
    steps:
      - checkout: self
        fetchDepth: 0
      - template: templates/tools.yml
        parameters:
          tools: [gitleaks]
      - script: |
          set -euo pipefail
          target="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          git fetch --no-tags origin "+refs/heads/$target:refs/remotes/origin/$target"
          base="$(git merge-base "origin/$target" HEAD)"
          echo "scanning $base..HEAD"
          gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$base..HEAD" .
        displayName: gitleaks, this pull request's commits

  - job: history
    condition: ne(variables['Build.Reason'], 'PullRequest')
    steps:
      - checkout: self
        fetchDepth: 0
      - template: templates/tools.yml
        parameters:
          tools: [gitleaks]
      - script: gitleaks git --no-banner --redact --config .gitleaks.toml .
        displayName: gitleaks, full history
