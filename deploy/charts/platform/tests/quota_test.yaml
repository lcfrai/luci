suite: quota
templates:
  - templates/quota.yaml
values:
  - ./values-test.yaml
tests:
  # A container LimitRange with only `max` gives an unsized container default = max and
  # defaultRequest = default, and LimitRanger defaults init containers too (training
  # knowledge of Kubernetes, UNVERIFIED here): one unsized container would ask for the
  # whole session ceiling, take most of a node and hold the quota while Pending (review I4).
  # default == defaultRequest also keeps a defaulted container at requests == limits,
  # as Kata needs.
  # Mutant killed: a `max`-only LimitRange.
  - it: limitrange_defaults_to_one_session
    documentSelector:
      path: kind
      value: LimitRange
    asserts:
      - equal:
          path: metadata.name
          value: sandboxes
      - equal:
          path: metadata.namespace
          value: panacea-sandboxes
      - lengthEqual:
          path: spec.limits
          count: 1
      - equal:
          path: spec.limits[0].type
          value: Container
      - equal:
          path: spec.limits[0].max
          value:
            cpu: 6000m
            memory: 20480Mi
      - equal:
          path: spec.limits[0].default
          value:
            cpu: 2000m
            memory: 4096Mi
      - equal:
          path: spec.limits[0].defaultRequest
          value:
            cpu: 2000m
            memory: 4096Mi

  # The namespace ceiling is not per user - the broker enforces per-user limits (task 17).
  - it: quota_caps_the_whole_namespace
    documentSelector:
      path: kind
      value: ResourceQuota
    asserts:
      - equal:
          path: metadata.name
          value: sandboxes
      - equal:
          path: metadata.namespace
          value: panacea-sandboxes
      - equal:
          path: spec.hard["requests.cpu"]
          value: "64"
      - equal:
          path: spec.hard["requests.memory"]
          value: 128Gi
      - equal:
          path: spec.hard.pods
          value: "64"
      - equal:
          path: spec.hard.persistentvolumeclaims
          value: "64"
      - equal:
          path: spec.hard["requests.storage"]
          value: 4Ti
