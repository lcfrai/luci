name: Luci build and release candidates

on:
  pull_request:
  push:
    branches: [main, 'feat/phase-2-cockpit']
  workflow_dispatch:
    inputs:
      native_windows_only:
        description: 'Run only Windows build and installed-app diagnostics; does not establish full release acceptance'
        type: boolean
        default: false
      ssh_only:
        description: 'Run only the real existing-workspace SSH browser acceptance'
        type: boolean
        default: false
      installer_run:
        description: 'Optional completed run ID: test its existing Windows installer without rebuilding'
        type: string
        default: ''
      installer_release:
        description: 'Optional private draft release tag: test its exact installer without rebuilding'
        type: string
        default: ''
      installer_sha256:
        description: 'Required with installer_release: independently recorded installer SHA256'
        type: string
        default: ''
      upgrade_from_03:
        description: 'Seed with the retained 0.3.0 installer and verify the upgrade'
        type: boolean
        default: false
      upgrade_from_release:
        description: 'Optional retained previous release: v0.4.1-rc.4 (independently pinned)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: luci-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.installer_run || inputs.installer_release || (inputs.ssh_only && 'ssh') || (inputs.native_windows_only && 'windows-diagnostic') || 'build' }}
  cancel-in-progress: false

env:
  # Keep this aligned with desktop/package.json and product.Version.
  LUCI_VERSION: '0.5.0'
  GO_VERSION: '1.26.3'
  NODE_VERSION: '24.19.0'

jobs:
  reject-conflicting-native-diagnostics:
    name: Validate native diagnostic inputs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_windows_only && (inputs.ssh_only || inputs.installer_run || inputs.installer_release || inputs.upgrade_from_03 || inputs.upgrade_from_release) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject conflicting diagnostic modes
        run: |
          printf '%s\n' 'native_windows_only runs a fresh Windows build/install. Do not combine it with SSH, existing-installer, or previous-version inputs.' >&2
          exit 1

  verify:
    name: Go and desktop checks
    if: ${{ !inputs.installer_run && !inputs.installer_release && !inputs.ssh_only && !inputs.native_windows_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      checks: ${{ steps.record_checks.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            control-plane/go.sum
            sandboxd/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check release version and integrity tooling
        run: |
          python3 scripts/release-version.py check "$LUCI_VERSION"
          python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - name: Verify Go failure reporting
        run: python3 -m unittest discover -s scripts -p 'test_ci_go_tests.py'
      - name: Verify native acceptance failure reporting
        run: node --test scripts/test-native-eval-report.mjs
      - name: Test Go services
        id: go_tests
        run: python3 scripts/ci-go-tests.py --name 'Go services' --output artifacts/go-tests/services -- go test -json ./control-plane/... ./sandboxd/...
      - name: Check concurrent control-plane paths
        id: race_tests
        if: runner.os == 'Linux'
        run: python3 scripts/ci-go-tests.py --name 'Go race checks' --output artifacts/go-tests/race -- go test -json -race ./control-plane/internal/management/... ./control-plane/internal/product/... ./control-plane/internal/project/... ./control-plane/internal/platform/...
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Check production dependency advisories
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high
      - name: Test desktop
        id: desktop_tests
        working-directory: desktop
        run: npm test
      - name: Type-check desktop
        id: desktop_types
        working-directory: desktop
        run: npm run typecheck
      - name: Build desktop assets
        id: desktop_build
        working-directory: desktop
        run: npm run build
      - name: Install browser acceptance runtime
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Run connected browser UAT against the candidate service
        id: browser_tests
        run: |
          mkdir -p artifacts/browser-uat
          CGO_ENABLED=0 go build -trimpath -o artifacts/browser-uat/luci ./control-plane/cmd/api
          node scripts/run-ui-uat.mjs artifacts/browser-uat/luci desktop/dist .
      - name: Record successful application checks
        id: record_checks
        if: ${{ !cancelled() && steps.go_tests.outcome == 'success' && steps.race_tests.outcome == 'success' && steps.desktop_tests.outcome == 'success' && steps.desktop_types.outcome == 'success' && steps.desktop_build.outcome == 'success' && steps.browser_tests.outcome == 'success' }}
        run: echo "passed=passed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: luci-connected-browser-uat-${{ github.sha }}
          path: artifacts/uat/*/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain Go test diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: luci-go-tests-${{ github.sha }}
          path: artifacts/go-tests/
          if-no-files-found: warn
          retention-days: 14

  runtime-smoke:
    name: Real Docker and SSH browser UAT
    needs: verify
    if: ${{ always() && !cancelled() && !inputs.installer_run && !inputs.installer_release && !inputs.native_windows_only && (needs.verify.outputs.checks == 'passed' || inputs.ssh_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      checks: ${{ steps.record_checks.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            control-plane/go.sum
            sandboxd/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the actual control service
        run: |
          mkdir -p artifacts/runtime-smoke
          CGO_ENABLED=0 go build -trimpath -o artifacts/runtime-smoke/luci ./control-plane/cmd/api
      - name: Prepare actual browser and SSH runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/luci-uat-browsers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo install -d -m 755 /run/sshd
          sudo install -d -m 777 /opt/luci-uat-browsers
          npm ci --prefix desktop
          npm run build --prefix desktop
          cd desktop
          npx playwright install --with-deps chromium
          sudo chmod -R a+rX /opt/luci-uat-browsers
      - name: Exercise the compiled multi-user control plane
        id: control_tests
        if: ${{ !inputs.ssh_only }}
        run: node scripts/control-plane-smoke.mjs --binary artifacts/runtime-smoke/luci --output artifacts/control-plane-smoke.json
      - name: Prepare isolated runtime acceptance fixtures
        id: runtime-fixtures
        shell: bash
        run: |
          set -euo pipefail
          # The runner often uses UID 1001, matching the image's default user.
          # A separate UID proves private host bind mounts work after remapping.
          sudo useradd --uid 10123 --user-group --groups docker --create-home luci-eval
          # The private SSH fixture accepts only its generated key. Unlock this
          # disposable account so OpenSSH permits that key authentication.
          sudo passwd -d luci-eval
          test "$(id -u luci-eval)" != 1001
          stage=$(mktemp -d /tmp/luci-runtime-ci-XXXXXX)
          chmod 755 "$stage"
          mkdir -p "$stage/scripts" "$stage/images" "$stage/sandboxd"
          cp artifacts/runtime-smoke/luci "$stage/luci"
          cp scripts/runtime-smoke.mjs "$stage/scripts/runtime-smoke.mjs"
          cp scripts/provider-smoke.py "$stage/scripts/provider-smoke.py"
          cp scripts/workspace-browser-eval.mjs "$stage/scripts/workspace-browser-eval.mjs"
          mkdir -p "$stage/desktop"
          cp -a desktop/dist desktop/scripts desktop/node_modules desktop/package.json "$stage/desktop/"
          cp -R images/sandbox "$stage/images/sandbox"
          for source in cmd internal vendor go.mod go.sum; do cp -R "sandboxd/$source" "$stage/sandboxd/$source"; done
          chmod -R a+rX "$stage"
          sudo install -d -o luci-eval -g luci-eval -m 700 "$stage/evidence"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Exercise Docker as a distinct non-root host user
        id: docker_tests
        if: ${{ !inputs.ssh_only }}
        env:
          LUCI_EVAL_STAGE: ${{ steps.runtime-fixtures.outputs.stage }}
        run: |
          stage="$LUCI_EVAL_STAGE"
          sudo -H -u luci-eval env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/luci-uat-browsers LUCI_RUNTIME_UI=1 node "$stage/scripts/runtime-smoke.mjs" "$stage/luci" "$stage/evidence"
      - name: Exercise real SSH workspace onboarding through the browser
        id: ssh_tests
        if: ${{ always() && steps.runtime-fixtures.outcome == 'success' }}
        env:
          LUCI_EVAL_STAGE: ${{ steps.runtime-fixtures.outputs.stage }}
        run: |
          stage="$LUCI_EVAL_STAGE"
          sudo -H -u luci-eval env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH=/opt/luci-uat-browsers node "$stage/scripts/workspace-browser-eval.mjs" --binary "$stage/luci" --desktop "$stage/desktop" --output "$stage/evidence/workspace-browser"
      - name: Capture independent runtime acceptance evidence
        id: capture_evidence
        if: ${{ always() && steps.runtime-fixtures.outcome == 'success' }}
        env:
          LUCI_EVAL_STAGE: ${{ steps.runtime-fixtures.outputs.stage }}
        run: |
          sudo tar -czf "$RUNNER_TEMP/luci-runtime-evidence.tar.gz" -C "$LUCI_EVAL_STAGE/evidence" .
          sudo chmod 644 "$RUNNER_TEMP/luci-runtime-evidence.tar.gz"
      - name: Record successful runtime checks
        id: record_checks
        if: ${{ !cancelled() && steps.control_tests.outcome == 'success' && steps.docker_tests.outcome == 'success' && steps.ssh_tests.outcome == 'success' && steps.capture_evidence.outcome == 'success' }}
        run: echo "passed=passed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: luci-real-runtime-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/luci-runtime-evidence.tar.gz
            artifacts/control-plane-smoke.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  portable:
    name: Portable ${{ matrix.target }}
    needs: [verify, runtime-smoke]
    # Evidence upload failures remain red, but do not suppress native testing
    # when every required application and runtime check actually passed.
    if: ${{ always() && !cancelled() && needs.verify.outputs.checks == 'passed' && needs['runtime-smoke'].outputs.checks == 'passed' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            control-plane/go.sum
            sandboxd/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build portable archive with runtime and licence evidence
        run: bash scripts/build-release.sh "$LUCI_VERSION" '${{ matrix.target }}'
      - name: Check archive and start packaged service
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/luci-package"
          mkdir -p "$package_dir"
          tar -xzf "artifacts/releases/$LUCI_VERSION/luci-${{ matrix.target }}.tar.gz" -C "$package_dir"
          test -f "$package_dir/licenses/manifest.json"
          test -f "$package_dir/runtime/sandboxd/vendor/modules.txt"
          test -f "$package_dir/runtime/images/sandbox/Dockerfile"
          test -f "$package_dir/web/index.html"
          test -f "$package_dir/cloud/luci-cloud-linux-amd64.tar.gz"
          python3 - "$package_dir/cloud/luci-cloud-linux-amd64.tar.gz" <<'PY'
          import sys, tarfile
          with tarfile.open(sys.argv[1]) as archive:
              names = set(archive.getnames())
          assert {'luci', 'web/index.html', 'licenses/manifest.json', 'runtime/sandboxd/vendor/modules.txt'} <= names
          assert not any(name == 'cloud' or name.startswith('cloud/') for name in names), 'Recursive cloud bundle'
          PY
          node scripts/verify-portable.mjs "$package_dir" "artifacts/package-eval/${{ matrix.target }}"
          node scripts/control-plane-smoke.mjs --binary "$package_dir/luci" --output "artifacts/package-eval/${{ matrix.target }}/control-plane-smoke.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luci-${{ matrix.target }}-${{ github.sha }}
          path: |
            artifacts/releases/${{ env.LUCI_VERSION }}/*.tar.gz
            artifacts/releases/${{ env.LUCI_VERSION }}/SHA256SUMS
            artifacts/releases/${{ env.LUCI_VERSION }}/release-manifest.json
            artifacts/package-eval/**/*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-installer:
    name: Windows native installer and portable packages
    needs: [verify, runtime-smoke]
    # Explicit manual diagnostics retain the complete Windows build/install
    # assertions. Normal PR/release runs still require every source/runtime gate.
    if: ${{ always() && !cancelled() && ((needs.verify.outputs.checks == 'passed' && needs['runtime-smoke'].outputs.checks == 'passed') || (github.event_name == 'workflow_dispatch' && inputs.native_windows_only && !inputs.ssh_only && !inputs.installer_run && !inputs.installer_release && !inputs.upgrade_from_03 && !inputs.upgrade_from_release)) }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            control-plane/go.sum
            sandboxd/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify native acceptance failure reporting
        run: |
          ./scripts/test-dev-windows.ps1
          node --test scripts/test-native-eval-report.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native failure-reporting regression tests failed' }
      - name: Prepare stable Rust MSVC toolchain
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed' }
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build portable packages and unsigned NSIS installer
        run: |
          ./scripts/test-owned-build-stage.ps1 -OutputDirectory artifacts/package-eval/windows/build-stage-guards
          ./scripts/build-release.ps1 -Version $env:LUCI_VERSION -Native
      - name: Verify native state selection and upgrade regression
        working-directory: desktop/src-tauri
        run: cargo test --locked --release --lib
      - name: Exercise the packaged Windows control plane
        run: |
          node scripts/verify-portable.mjs "artifacts/releases/$env:LUCI_VERSION/luci-windows-amd64" artifacts/package-eval/windows
          if ($LASTEXITCODE -ne 0) { throw 'Portable acceptance failed' }
          node scripts/control-plane-smoke.mjs --binary "artifacts/releases/$env:LUCI_VERSION/luci-windows-amd64/luci.exe" --output artifacts/package-eval/windows/control-plane-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Multi-user acceptance failed' }
      - name: Verify native installer exists
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) { throw 'No NSIS installer was produced' }
          $lines = $installers | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() + '  ' + $_.Name }
          [System.IO.File]::WriteAllLines((Join-Path $installers[0].Directory.FullName 'SHA256SUMS'), $lines, [System.Text.UTF8Encoding]::new($false))
          Copy-Item -LiteralPath "artifacts/releases/$env:LUCI_VERSION/release-manifest.json" -Destination (Join-Path $installers[0].Directory.FullName 'release-manifest.json')
      - name: Exercise the installed native application
        run: |
          $installer = @(Get-ChildItem -LiteralPath desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          ./scripts/test-installed-windows.ps1 -Installer $installer[0].FullName
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: luci-installed-windows-evidence-${{ github.sha }}
          path: |
            artifacts/native-installed-eval/*-result.json
            artifacts/native-installed-eval/installer-receipt.json
            artifacts/native-installed-eval/*.png
            artifacts/native-installed-eval/*-failure-text.txt
            artifacts/native-installed-eval/driver-*.log
            artifacts/package-eval/windows/*.json
            artifacts/windows-source-launcher/results.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luci-windows-native-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS
            desktop/src-tauri/target/release/bundle/nsis/release-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luci-portable-windows-build-${{ github.sha }}
          path: |
            artifacts/releases/${{ env.LUCI_VERSION }}/*.zip
            artifacts/releases/${{ env.LUCI_VERSION }}/*.tar.gz
            artifacts/releases/${{ env.LUCI_VERSION }}/SHA256SUMS
            artifacts/releases/${{ env.LUCI_VERSION }}/release-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  installed-diagnostic:
    name: Installed Windows release diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_windows_only && (inputs.installer_run != '' || inputs.installer_release != '') }}
    # GitHub requires push access to list/download unpublished draft releases.
    # This manual job uses that token only for reads in the download step;
    # pull-request/build jobs retain the workflow's read-only permissions.
    permissions:
      contents: write
      actions: read
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Obtain the existing installer and verify its recorded hash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN: ${{ inputs.installer_run }}
          INSTALLER_RELEASE: ${{ inputs.installer_release }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          UPGRADE_FROM_03: ${{ inputs.upgrade_from_03 }}
          UPGRADE_FROM_RELEASE: ${{ inputs.upgrade_from_release }}
        run: |
          if ($env:INSTALLER_RUN -and $env:INSTALLER_RELEASE) { throw 'Choose one installer source' }
          if ($env:UPGRADE_FROM_03 -eq 'true' -and $env:UPGRADE_FROM_RELEASE) { throw 'Choose one previous installer source' }
          if ($env:UPGRADE_FROM_RELEASE -and $env:UPGRADE_FROM_RELEASE -ne 'v0.4.1-rc.4') { throw 'Previous release must be the independently pinned v0.4.1-rc.4 candidate' }
          if ($env:INSTALLER_RELEASE) {
            if ($env:INSTALLER_RELEASE -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' -or $env:INSTALLER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Release tag and independently recorded installer SHA256 are required' }
            # A draft has no published Git tag; releases/tags/<tag> returns404.
            $pages = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Draft release listing failed' }
            $draftCandidates = @(foreach ($page in $pages) { foreach ($item in $page) { if ($item.tag_name -eq $env:INSTALLER_RELEASE) { $item } } })
            if ($draftCandidates.Count -ne 1 -or -not $draftCandidates[0].draft) { throw 'Diagnostic release must be an accessible private draft candidate' }
            $release = $draftCandidates[0]
            gh release download $env:INSTALLER_RELEASE --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --pattern release-manifest.json --dir artifacts/diagnostic-installer
            if ($LASTEXITCODE -ne 0) { throw 'Draft candidate download failed' }
          } else {
            if ($env:INSTALLER_RUN -notmatch '^\d+$') { throw 'installer_run must be a numeric completed CI run ID' }
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success') { throw 'Source installer run must have succeeded' }
            $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN/artifacts" | ConvertFrom-Json
            $native = @($artifacts.artifacts | Where-Object { $_.name -like 'luci-windows-native-*' -and -not $_.expired })
            if ($native.Count -ne 1) { throw 'Expected one retained native installer artifact' }
            gh run download $env:INSTALLER_RUN --repo $env:GITHUB_REPOSITORY --name $native[0].name --dir artifacts/diagnostic-installer
            if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          }
          $manifest = Get-Content artifacts/diagnostic-installer/release-manifest.json -Raw | ConvertFrom-Json
          $installer = @($manifest.artifacts | Where-Object { $_.name -like '*-setup.exe' })
          if ($installer.Count -ne 1) { throw 'Expected one installer manifest entry' }
          if ($installer[0].name -ne [IO.Path]::GetFileName($installer[0].name) -or $manifest.sourceCommit -notmatch '^[a-fA-F0-9]{40}$') { throw 'Invalid installer source manifest' }
          $path = Join-Path (Resolve-Path artifacts/diagnostic-installer).Path $installer[0].name
          if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $installer[0].sha256) { throw 'Installer hash differs from source build manifest' }
          if ($env:INSTALLER_RELEASE) {
            if ($installer[0].sha256 -ne $env:INSTALLER_SHA256.ToLowerInvariant()) { throw 'Draft installer differs from independently recorded hash' }
            $asset = @($release.assets | Where-Object name -eq $installer[0].name)
            if ($asset.Count -ne 1 -or $asset[0].digest -ne ('sha256:' + $installer[0].sha256)) { throw 'Draft asset server digest differs from manifest' }
          }
          "NATIVE_INSTALLER=$path" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          $provenance = @{ scriptsCommit=$env:GITHUB_SHA; installerRun=$env:INSTALLER_RUN; installerRelease=$env:INSTALLER_RELEASE; installerSourceCommit=$manifest.sourceCommit; installerSHA256=$installer[0].sha256 }
          New-Item -ItemType Directory -Path artifacts/native-installed-eval -Force | Out-Null
          if ($env:UPGRADE_FROM_03 -eq 'true') {
            gh release download v0.3.0-rc.1 --repo $env:GITHUB_REPOSITORY --pattern Luci_0.3.0_x64-setup.exe --dir artifacts/diagnostic-previous
            if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed' }
            $previous = (Resolve-Path artifacts/diagnostic-previous/Luci_0.3.0_x64-setup.exe).Path
            if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne '81db0b7006bf8967d924cab362b4db1c140ddc48ca7b26b110dab7edc463c179') { throw 'Previous installer differs from retained 0.3.0 candidate' }
            "PREVIOUS_INSTALLER=$previous" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
            'PREVIOUS_VERSION=0.3.0' | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
            $provenance.previousInstallerRelease = 'v0.3.0-rc.1'
            $provenance.previousInstallerVersion = '0.3.0'
            $provenance.previousInstallerSHA256 = '81db0b7006bf8967d924cab362b4db1c140ddc48ca7b26b110dab7edc463c179'
          } elseif ($env:UPGRADE_FROM_RELEASE) {
            $previousSHA = '032a0428f08cc7e1b9b66fb9b12a1353958ad1090622362bcde3e269888eafb4'
            $previousName = 'Luci_0.4.1_x64-setup.exe'
            $previousPages = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Previous draft release listing failed' }
            $previousReleases = @(foreach ($page in $previousPages) { foreach ($item in $page) { if ($item.tag_name -eq $env:UPGRADE_FROM_RELEASE) { $item } } })
            if ($previousReleases.Count -ne 1 -or -not $previousReleases[0].draft) { throw 'Expected the retained private 0.4.1 draft release' }
            $previousAssets = @($previousReleases[0].assets | Where-Object name -eq $previousName)
            if ($previousAssets.Count -ne 1 -or $previousAssets[0].digest -ne ('sha256:' + $previousSHA) -or $previousAssets[0].size -ne 57542112) { throw 'Previous release server identity differs from the independently retained 0.4.1 installer' }
            gh release download $env:UPGRADE_FROM_RELEASE --repo $env:GITHUB_REPOSITORY --pattern $previousName --pattern release-manifest.json --dir artifacts/diagnostic-previous
            if ($LASTEXITCODE -ne 0) { throw 'Previous 0.4.1 release download failed' }
            $previous = (Resolve-Path (Join-Path artifacts/diagnostic-previous $previousName)).Path
            if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne $previousSHA) { throw 'Previous installer differs from independently pinned 0.4.1 candidate' }
            $previousManifest = Get-Content artifacts/diagnostic-previous/release-manifest.json -Raw | ConvertFrom-Json
            $previousEntries = @($previousManifest.artifacts | Where-Object name -eq $previousName)
            if ($previousEntries.Count -ne 1 -or $previousEntries[0].sha256 -ne $previousSHA -or $previousManifest.sourceCommit -ne 'd9e743122a3ecc4c8c675d019c679db9a51bfaa6') { throw 'Previous installer manifest differs from the retained 0.4.1 source and installer' }
            "PREVIOUS_INSTALLER=$previous" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
            'PREVIOUS_VERSION=0.4.1' | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
            $provenance.previousInstallerRelease = $env:UPGRADE_FROM_RELEASE
            $provenance.previousInstallerVersion = '0.4.1'
            $provenance.previousInstallerSHA256 = $previousSHA
            $provenance.previousInstallerSourceCommit = $previousManifest.sourceCommit
          }
          $provenance | ConvertTo-Json | Set-Content artifacts/native-installed-eval/input-provenance.json
      - name: Exercise the installed release
        run: ./scripts/test-installed-windows.ps1 -Installer $env:NATIVE_INSTALLER -PreviousInstaller "$env:PREVIOUS_INSTALLER" -PreviousVersion "$env:PREVIOUS_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: luci-installed-diagnostic-${{ github.run_id }}
          path: |
            artifacts/native-installed-eval/*-result.json
            artifacts/native-installed-eval/installer-receipt.json
            artifacts/native-installed-eval/input-provenance.json
            artifacts/native-installed-eval/*.png
            artifacts/native-installed-eval/*-failure-text.txt
            artifacts/native-installed-eval/driver-*.log
          if-no-files-found: warn
          retention-days: 14
