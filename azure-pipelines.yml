trigger:
  branches:
    include: [main, dev]

pool:
  vmImage: ubuntu-latest

steps:
  - task: GoTool@0
    inputs:
      version: '1.23'
  - script: go build ./canvas/... ./sandboxd/... ./control-plane/...
    displayName: Build
  - script: go test ./canvas/... ./sandboxd/... ./control-plane/... -race -count=1
    displayName: Test
  - script: go vet ./canvas/... ./sandboxd/... ./control-plane/...
    displayName: Vet
