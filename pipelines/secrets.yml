# pipelines/secrets.yml — the secret scanner (phase 8 task 28): gitleaks over a pull request's own
# commits (<merge base with the target>..HEAD, pipelines/scripts/secrets-pr.sh), and over the full
# history on a push to main or dev. .gitleaks.toml allowlists the known test fixtures by path and
# exact value, never by a broad regex. Findings are printed redacted.
#
# pr: is the record of the pull-request path filter: Azure Repos reads the branch policy's filter,
# not this block (UNVERIFIED, see azure-pipelines.yml); task 31's runbook copies it there. "/" is
# the repository root: every change.
trigger:
  branches:
    include: [main, dev]
  paths:
    include: ['/']
pr:
  branches:
    include: ['*']
  paths:
    include: ['/']

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: pull_request
    condition: eq(variables['Build.Reason'], 'PullRequest')
    steps:
      # Full depth, so the checkout's own fetch (the only one that carries the job's token) brings
      # the target branch too; secrets-pr.sh fetches nothing (fix round 1, review I3).
      - checkout: self
        fetchDepth: 0
      - script: bash pipelines/scripts/secrets-pr_test.sh
        displayName: secrets-pr_test (the range script's own cases)
      - template: templates/tools.yml
        parameters:
          tools: [gitleaks]
      - script: bash pipelines/scripts/secrets-pr.sh
        displayName: gitleaks, this pull request's commits

  - job: history
    condition: ne(variables['Build.Reason'], 'PullRequest')
    steps:
      - checkout: self
        fetchDepth: 0
      - template: templates/tools.yml
        parameters:
          tools: [gitleaks]
      - script: gitleaks git --no-banner --redact --config .gitleaks.toml .
        displayName: gitleaks, full history
