trigger:
  branches:
    include: [main, dev]

pool:
  vmImage: ubuntu-latest

steps:
  - task: GoTool@0
    inputs:
      version: '1.23'
  - script: go build ./canvas/... ./sandboxd/... ./control-plane/...
    displayName: Build
  - script: go test ./canvas/... ./sandboxd/... ./control-plane/... -race -count=1
    displayName: Test
  - script: go vet ./canvas/... ./sandboxd/... ./control-plane/...
    displayName: Vet
  # 24.x, not the sandbox image's 20: vitest 5.0.1 and jsdom 30.1.0 declare
  # engines node ^22.12.0 || ^24 (jsdom ^24.15.0); the package is tested locally on 24.15.0.
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
  - script: cd canvas/editor && npm ci && npx tsc --noEmit && npx vitest run
    displayName: Canvas editor
