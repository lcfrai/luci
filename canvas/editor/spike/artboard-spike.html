// The artboard document, exactly as task 24 builds it; only the body differs.
function srcdocFor(body, { csp = true, head = "" } = {}) {
  const meta = csp ? `<meta http-equiv=Content-Security-Policy content="${CSP}">` : "";

    `<style>html,body{margin:0;padding:0}</style>${head}</head><body>${body}</body></html>`;

function mountFrame(id, body, { w = 390, h = 844, sandbox = true, csp = true, head = "", into = null, label = "" } = {}) {
  let cell = into;
  if (!cell) {
    cell = document.createElement("div");
    cell.className = "cell";
    const l = document.createElement("span");
    l.className = "label";
    l.textContent = label || id;
    cell.appendChild(l);

  f.setAttribute("height", String(h));
